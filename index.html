<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMO'S Pizza Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="menu-board" aria-live="polite">
    <div class="top-stripe"></div>
    <header class="masthead">
      <div class="brand-lockup">
        <div class="brand-mark">IMO'S</div>
        <div class="brand-sub">PIZZA</div>
      </div>
      <div class="header-message">
        <span class="eyebrow">ST. LOUIS STYLE</span>
        <strong>Every pizza is a square meal.</strong>
      </div>
      <div class="page-indicator"><span id="page-number">01</span><i>/</i>02</div>
    </header>
    <section class="hero-band">
      <div>
        <span class="eyebrow">MADE FRESH • MADE HERE</span>
        <h1 id="page-title">PIZZA &amp; FAVORITES</h1>
      </div>
      <div class="hero-copy" id="page-copy">Provel® cheese. Crisp, cracker-thin crust. Big flavor in every square.</div>
    </section>
    <section class="menu-content" id="menu-content"></section>
    <footer class="footer-bar">
      <div><span class="footer-dot"></span> ORDER ONLINE &nbsp; <b>IMOS.COM</b></div>
      <div>PRICES MAY VARY BY LOCATION &nbsp; <span class="page-dots"><b></b><b></b></span></div>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
